name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve workspace dependencies
        run: dart pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Verify example codegen
        working-directory: example
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code lib/
      - name: Analyze workspace
        run: |
          dart analyze --fatal-infos packages/auspex
          dart analyze --fatal-infos packages/auspex_gen
          dart analyze --fatal-infos example
      - name: Run tests
        run: |
          dart test packages/auspex/test
          dart test packages/auspex_gen/test
          dart test example/test
